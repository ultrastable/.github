name: agent-files
# COHERENCE-1 (Rowan, 2026-11-25): one source for every instruction surface. This repository's agent files (AGENTS.md, CLAUDE.md, GEMINI.md,
# copilot and cursor rules, PR and issue templates) are generated from workers/agents/CONTRACT.md in ultrastable/ultrastable by
# workers/tools/sync_agent_files.py. A hand edit here is drift: this job regenerates them and opens a pull request the lane merges.
# budget: ~1 min per day (one shallow clone, one generator run)
# trigger: daily and dispatch; the contract changes only by merges in ultrastable/ultrastable, so daily is enough
# free-alternative: `python3 -m foundation coherence --check --remote` in ultrastable/ultrastable reports the drift from a cloud session
on:
  schedule: [{ cron: "53 5 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: { group: agent-files, cancel-in-progress: false }
jobs:
  sync:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the agent files from the one contract
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ultrastable/ultrastable.git /tmp/main || { echo "::error::agent-files: clone failed"; exit 1; }
          src=$(git -C /tmp/main rev-parse --short HEAD)
          python3 /tmp/main/workers/tools/sync_agent_files.py --repo .github --target .
          git add -A
          if git diff --cached --quiet; then echo "agent files match ultrastable/ultrastable@$src"; exit 0; fi
          git config user.name ultrastable-agent-files; git config user.email agent-files@users.noreply.github.com
          git checkout -B agent-files/auto
          git commit -m "agent-files: regenerate from ultrastable/ultrastable@$src (COHERENCE-1)"
          git push -f origin agent-files/auto || { echo "::error::agent-files: push refused"; exit 1; }
          gh pr view agent-files/auto --json state -q .state 2>/dev/null | grep -q OPEN || \
            gh pr create --head agent-files/auto --base main --title "agent-files: regenerate from ultrastable/ultrastable@$src" --body "Generated by workers/tools/sync_agent_files.py (COHERENCE-1)."
